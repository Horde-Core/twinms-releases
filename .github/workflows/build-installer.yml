name: Build installer

# Builds the full TwinMS client installer and publishes it to THIS repo's Releases
# (the feed electron-updater follows). It combines three things:
#   • twinms-frontend             — checked out + built here (owns the Electron shell + packaging)
#   • backend.zip                  — from the newest release-* in the twinms-backend repo. The DB snapshot
#                                     (db-backup*) is NOT bundled — the client downloads it on first run.
#   • Mongo/Node/VC++ binaries     — fetched by the app's setup-local-stack.ps1 -BinariesOnly
#
# Triggers: workflow_dispatch (manual) + repository_dispatch (auto) — fired by a
# twinms-frontend push (frontend-push) or a new twinms-backend release (backend-release).
#
# Channels: manual runs pick via the "channel" input. Auto builds map the SOURCE
# BRANCH to a channel: frontend push to master → prod (full release, all clients
# auto-update); push to develop → develop channel (GitHub PRErelease, x.y.z-dev.N —
# only installs whose own version has a -dev suffix follow it). backend-release
# dispatches → develop; prod picks up the newest backend.zip at its next build.
#
# Required secret (repo or org):
#   ORCHESTRATOR_TOKEN — fine-grained PAT with
#                          • Contents: READ        on Horde-Core/twinms-frontend
#                          • Contents: READ        on Horde-Core/twinms-backend   (backend.zip + db-backup* live here now)
#                          • Contents: READ & WRITE on Horde-Core/twinms-releases

on:
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: "twinms-frontend ref to build (branch / tag / SHA)"
        required: false
        default: master
      version:
        description: "Installer version (semver, e.g. 0.5.0). Blank = auto patch-bump."
        required: false
      channel:
        description: "develop = prerelease for testers only; prod = full release — ALL CLIENTS UPDATE"
        required: false
        type: choice
        options:
          - develop
          - prod
        default: develop
  repository_dispatch:
    types: [frontend-push, backend-release]

concurrency:
  group: build-installer
  cancel-in-progress: false

jobs:
  build:
    # GitHub-hosted Windows. Switch to [self-hosted, windows] to reuse the backend's
    # runner (free minutes + you can cache vendor/ on disk between runs).
    runs-on: windows-latest

    steps:
      - name: Check out twinms-frontend
        uses: actions/checkout@v4
        with:
          repository: Horde-Core/twinms-frontend
          ref: ${{ github.event.inputs.frontend_ref || github.event.client_payload.ref || 'master' }}
          token: ${{ secrets.ORCHESTRATOR_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # node-window-manager (and its dep extract-file-icon) are native addons that
      # compile via node-gyp on install. The hosted runner's automatic Visual Studio
      # detection can fail ("could not find a version of Visual Studio 2017 or newer"),
      # so wire up the build toolchain explicitly before `npm ci`:
      #   • Python 3.12 — node-gyp's gyp scripts (the runner default 3.14 is too new)
      #   • MSVC dev env — exports VCINSTALLDIR so node-gyp uses that compiler directly
      - name: Set up Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up MSVC toolchain (for native node addons)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download newest backend build (backend.zip only)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_TOKEN }}
        run: |
          $rels = gh release list --repo Horde-Core/twinms-backend --limit 100 --json tagName,createdAt | ConvertFrom-Json
          # The installer only needs backend.zip (the bundled backend code). The DB snapshot (db-backup*)
          # is downloaded by the CLIENT on first run, NOT embedded. We still require the chosen release to
          # ALSO carry the db-backup* assets — so we only build from a COMPLETE release the client can later
          # restore from — but we download backend.zip alone.
          $tag = $null
          foreach ($r in ($rels | Where-Object { $_.tagName -like 'release-*' } | Sort-Object createdAt -Descending)) {
            $names = (gh release view $r.tagName --repo Horde-Core/twinms-backend --json assets | ConvertFrom-Json).assets.name
            $hasDbBackup = @($names | Where-Object { $_ -like 'db-backup*' }).Count -gt 0
            if (($names -contains 'backend.zip') -and $hasDbBackup) { $tag = $r.tagName; break }
          }
          if (-not $tag) { throw "No release-* with backend.zip + db-backup* found in twinms-backend." }
          Write-Host "Backend build from twinms-backend: $tag (db-backup* left for the client to download)"
          gh release download $tag --repo Horde-Core/twinms-backend --pattern backend.zip --dir _artifacts --clobber
          if (-not (Test-Path _artifacts\backend.zip)) {
            throw "Expected backend.zip in _artifacts after download."
          }

      - name: Unpack backend
        shell: pwsh
        run: |
          Expand-Archive _artifacts\backend.zip -DestinationPath _backend -Force  # dist + config + package.json (+lock)

      - name: Fetch vendor binaries (mongod / mongorestore / node / VC++ DLLs)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\setup-local-stack.ps1 -BinariesOnly

      - name: Install deps + build frontend
        shell: pwsh
        run: |
          npm ci
          npm run build   # next build -> out/

      # Obfuscate the app before packaging: electron main + renderer (out/), both in place.
      # Guarded by Test-Path so frontend refs that predate the script still build. In place is
      # fine here — the ephemeral CI checkout is discarded after, so no source restore is needed.
      # Runs BEFORE the token inject so electron/update-token.js stays a clean plain file.
      # javascript-obfuscator comes from the `npm ci` devDeps above.
      - name: Obfuscate app (electron + renderer)
        shell: pwsh
        run: |
          if (Test-Path scripts\obfuscate-app.js) {
            node scripts/obfuscate-app.js
          } else {
            Write-Host "scripts/obfuscate-app.js not present on this ref - skipping obfuscation."
          }

      # Decide the version to publish. A manual workflow_dispatch input wins; otherwise
      # auto patch-bump from the latest published v* release (the very first release
      # falls back to package.json's version). electron-updater needs strictly-increasing
      # semver, so every build gets a fresh, higher version.
      - name: Resolve + stamp version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_TOKEN }}
        run: |
          # Channel: manual input wins; auto builds map source branch → channel
          # (frontend push to master → prod; develop pushes + backend releases → develop).
          $channel = "${{ github.event.inputs.channel }}"
          if (-not $channel) {
            $srcRef = "${{ github.event.client_payload.ref }}"   # set by frontend-push; empty for backend-release
            $channel = if ($srcRef -eq 'master') { 'prod' } else { 'develop' }
          }
          $ver = "${{ github.event.inputs.version }}"
          if (-not $ver) {
            $rels = gh release list --repo Horde-Core/twinms-releases --limit 100 --json tagName | ConvertFrom-Json
            $vers = $rels.tagName |
              Where-Object { $_ -match '^v\d+\.\d+\.\d+$' } |   # stable tags only — dev tags (v*-dev.N) never advance the base version
              ForEach-Object { [version]($_.TrimStart('v')) } |
              Sort-Object -Descending
            if ($vers) {
              $l = @($vers)[0]
              $ver = "{0}.{1}.{2}" -f $l.Major, $l.Minor, ($l.Build + 1)
            } else {
              $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
            }
          }
          if ($channel -eq 'develop' -and $ver -notmatch '-') {
            # The -dev suffix IS the channel switch: auto-update.js enables allowPrerelease
            # only when the installed version has one. run_number keeps successive dev builds
            # strictly increasing; the eventual prod x.y.z supersedes all its x.y.z-dev.N.
            $ver = "$ver-dev.${{ github.run_number }}"
          }
          if ($channel -eq 'develop') {
            # Read by electron-builder's GitHub publisher in the publish step below:
            # forces the release to be created as a PRErelease (invisible to prod clients).
            Add-Content $env:GITHUB_ENV 'EP_PRE_RELEASE=true'
          }
          Write-Host "Publishing version: $ver (channel: $channel)"
          npm version $ver --no-git-tag-version --allow-same-version

      - name: Assemble stack (stage prebuilt backend + binaries into vendor/)
        shell: pwsh
        env:
          TWINMS_BACKEND_DIR: ${{ github.workspace }}\_backend
        run: node scripts/assemble-stack.js

      # Embed the CLIENT broker key so the installed app can reach the update broker
      # (a Cloudflare Worker) for updates + the first-run DB snapshot. This is a
      # low-value shared key — NOT a GitHub token — validated by the broker, which holds
      # the real GitHub read token server-side. Written into electron/update-key.js
      # (gitignored) right before packaging, so it ships inside the app but never in source.
      - name: Inject broker key (embedded in the app)
        shell: pwsh
        env:
          BROKER_KEY: ${{ secrets.BROKER_KEY }}
        run: |
          if (-not $env:BROKER_KEY) {
            throw "BROKER_KEY secret is missing. Add the TwinMS update-broker shared key as the BROKER_KEY secret."
          }
          Set-Content -NoNewline -Path electron/update-key.js -Value "module.exports = '$($env:BROKER_KEY)';"
          Write-Host "Wrote electron/update-key.js (broker key embedded)"

      # Embed the per-contract license token so the installed app can activate against
      # the control plane (Plan 2). Written into electron/license-key.js (gitignored)
      # right before packaging, same mechanism as the broker key above. Without it the
      # app has no client token and boots straight to "Activation required".
      - name: Inject client license token (embedded in the app)
        shell: pwsh
        env:
          CLIENT_TOKEN: ${{ secrets.CLIENT_TOKEN }}
        run: |
          if (-not $env:CLIENT_TOKEN) {
            throw "CLIENT_TOKEN secret is missing. Set it to the client's per-contract token from the control server's create-client CLI."
          }
          Set-Content -NoNewline -Path electron/license-key.js -Value "module.exports = '$($env:CLIENT_TOKEN)';"
          Write-Host "Wrote electron/license-key.js (client license token embedded)"

      - name: Build + publish installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.ORCHESTRATOR_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Show output
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.exe -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host ("{0}  ({1:N0} MB)" -f $_.Name, ($_.Length / 1MB)) }
